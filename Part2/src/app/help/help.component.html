<h2>Help & FAQ</h2>
<h3>How to add an item?</h3>
<p>Go to Manage page, fill in the form and click Add Item.</p>
<h3>How to update an item?</h3>
<p>Enter the existing item name, then new quantity/price, click Update.</p>
<h3>How to delete?</h3>
<p>Click Delete button next to the item in Manage page.</p>
